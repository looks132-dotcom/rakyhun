<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:"
    />
    <title>뭉글 메신저</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="messenger.css" />
  </head>
  <body class="messenger-body">
    <header class="messenger-header">
      <div>
        <strong>✳ 뭉글 메신저</strong
        ><small id="connection">사내 직접 연결</small>
      </div>
      <button id="open-office" class="secondary">프로필 · 설정 ↗</button>
    </header>
    <div class="messenger-layout">
      <aside class="messenger-sidebar">
        <h2>대화방</h2>
        <button id="new-room" class="create-room-button">
          ＋ 대화방 만들기
        </button>
        <div id="room-list"></div>
        <h2>동료 <span id="peer-count"></span></h2>
        <div id="contact-list"></div>
      </aside>
      <main class="messenger-main">
        <div class="messenger-room">
          <strong id="room-title">전체 대화</strong
          ><span>기록은 이 PC에 보관돼요</span>
        </div>
        <div id="history" aria-live="polite"></div>
        <div id="setup-help" class="hidden">
          <p>
            아직 모임이 없어요. 모임을 만들거나 동료의 초대 코드로 참여해
            주세요.
          </p>
          <button id="open-setup" class="primary">모임 만들기 / 참여</button>
        </div>
        <form id="messenger-form">
          <input
            id="message-input"
            maxlength="300"
            placeholder="대화를 입력해 주세요. @이름으로 동료 부르기"
            aria-label="메신저 메시지"
          /><button class="primary">보내기</button>
        </form>
        <div id="send-status" role="status">
          미접속 동료에게는 전달 대기로 보관하고, 함께 접속했을 때 전달해요.
        </div>
      </main>
    </div>
    <dialog id="room-dialog">
      <form id="room-form">
        <h2>새 대화방 만들기</h2>
        <label for="new-room-name">방 이름</label
        ><input
          id="new-room-name"
          maxlength="24"
          placeholder="예: 디자인팀"
          required
        />
        <p id="room-error" role="alert"></p>
        <div>
          <button type="button" id="cancel-room" class="secondary">취소</button
          ><button class="primary">만들기</button>
        </div>
      </form>
    </dialog>
    <script src="messenger.js"></script>
  </body>
</html>
